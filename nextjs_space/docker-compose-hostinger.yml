version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellnesslog
      POSTGRES_USER: wellnesslog
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellnesslog"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: https://github.com/vikram11/wellnesslogin.git#hostinger:nextjs_space
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wellnesslog:CHANGE_ME_STRONG_PASSWORD@db:5432/wellnesslog
      OLLAMA_API_KEY: bef1758095114d51be25ebb2d88679f8.BG34PpG7Eze4l82zNuWPA9Vy
      OLLAMA_MODEL: gemma4:31b-cloud
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: PASTE_YOUR_VAPID_PUBLIC_KEY
      VAPID_PRIVATE_KEY: PASTE_YOUR_VAPID_PRIVATE_KEY
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: "465"
      SMTP_USER: update@wellnesslog.in
      SMTP_PASS: PASTE_YOUR_EMAIL_PASSWORD
      EMAIL_FROM: "WellnessLog.in <update@wellnesslog.in>"
      NEXTAUTH_URL: https://wellnesslog.in
    networks:
      - caddy_network
      - internal
    labels:
      caddy: wellnesslog.in
      caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  pgdata:

networks:
  caddy_network:
    external: true
  internal:
    driver: bridge
